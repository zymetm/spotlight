name: Release

on:
  push:
    tags:
      # Obsidian community plugin convention: the tag is the bare version
      # number, e.g. "0.15.2" -- never a "v" prefix.
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run tests
        run: npm test

      - name: Verify manifest and package versions match the tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          if [ "$TAG" != "$MANIFEST_VERSION" ]; then
            echo "Tag ($TAG) does not match manifest.json version ($MANIFEST_VERSION)"
            exit 1
          fi
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PACKAGE_VERSION" ]; then
            echo "Tag ($TAG) does not match package.json version ($PACKAGE_VERSION)"
            exit 1
          fi

      - name: Verify versions.json has a row for this tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          node -e "
            const versions = require('./versions.json');
            if (!Object.prototype.hasOwnProperty.call(versions, process.env.TAG)) {
              console.error('versions.json has no row for ' + process.env.TAG);
              process.exit(1);
            }
          "
        env:
          TAG: ${{ github.ref_name }}

      - name: Create GitHub release (draft)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --draft \
            main.js manifest.json styles.css
